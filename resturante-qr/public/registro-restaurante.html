<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>Crear Restaurante</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<style>
:root{
--bg-1:#04101b;
--bg-2:#09192d;
--bg-3:#0d223b;
--text:#f7fbff;
--muted:#b9c8da;
--line:rgba(255,255,255,.10);
--card:rgba(10, 21, 39, .72);
--card-2:rgba(255,255,255,.05);
--gold:#d7b77a;
--gold-2:#f2dfb2;
--accent:#8ddcff;
--shadow:0 24px 70px rgba(0,0,0,.45);
--radius:24px;
}

*{
box-sizing:border-box;
}

body{
font-family: Inter, "Segoe UI", Arial, sans-serif;
background:
linear-gradient(rgba(4,10,18,.74), rgba(4,10,18,.84)),
url("https://images.unsplash.com/photo-1552566626-52f8b828add9?auto=format&fit=crop&w=1600&q=80") center/cover fixed no-repeat;
margin:0;
padding:30px 15px;
color:var(--text);
min-height:100vh;
position:relative;
}

body::before{
content:"";
position:fixed;
inset:0;
background:
radial-gradient(circle at top left, rgba(141,220,255,.12), transparent 24%),
radial-gradient(circle at bottom right, rgba(215,183,122,.10), transparent 22%);
pointer-events:none;
}

.contenedor{
max-width:600px;
margin:auto;
position:relative;
z-index:1;
}

.card{
background:var(--card);
padding:30px;
border-radius:20px;
box-shadow:var(--shadow);
border:1px solid var(--line);
backdrop-filter:blur(18px);
-webkit-backdrop-filter:blur(18px);
}

h2{
margin:0 0 8px;
font-size:2rem;
letter-spacing:-0.03em;
color:var(--text);
}

h3{
margin:22px 0 10px;
color:var(--gold-2);
font-size:1.08rem;
font-weight:700;
letter-spacing:.02em;
}

input{
width:100%;
padding:14px 14px;
margin-top:8px;
margin-bottom:15px;
border-radius:12px;
border:1px solid rgba(255,255,255,.10);
box-sizing:border-box;
background:rgba(255,255,255,.05);
color:var(--text);
outline:none;
transition:.25s ease;
font-size:15px;
}

input::placeholder{
color:#9fb0c5;
}

input:focus{
border-color:rgba(141,220,255,.45);
box-shadow:0 0 0 4px rgba(141,220,255,.10);
background:rgba(255,255,255,.07);
}

button{
width:100%;
padding:15px;
border:none;
border-radius:14px;
background:linear-gradient(135deg, var(--gold), var(--gold-2));
color:#08111d;
font-size:16px;
font-weight:800;
cursor:pointer;
transition:.25s ease;
box-shadow:0 14px 30px rgba(215,183,122,.22);
}

button:hover{
transform:translateY(-1px);
box-shadow:0 18px 34px rgba(215,183,122,.28);
}

button:disabled{
opacity:0.7;
cursor:not-allowed;
transform:none;
}

.precio{
font-size:28px;
font-weight:900;
margin:10px 0 20px;
color:var(--accent);
letter-spacing:-0.03em;
}

.estado{
margin-top:18px;
font-size:14px;
line-height:1.6;
color:var(--muted);
background:rgba(255,255,255,.04);
border:1px solid rgba(255,255,255,.08);
padding:12px 14px;
border-radius:12px;
min-height:48px;
}

.ok{
color:#7ef0b0;
font-weight:700;
}

.bad{
color:#ff9a9a;
font-weight:700;
}

.info-text{
font-size:13px;
color:var(--muted);
text-align:center;
margin-top:12px;
line-height:1.6;
}

.top-label{
display:inline-flex;
align-items:center;
gap:8px;
padding:8px 14px;
border-radius:999px;
background:rgba(141,220,255,.10);
border:1px solid rgba(141,220,255,.16);
color:#dff4ff;
font-size:.88rem;
margin-bottom:18px;
}
</style>
</head>
<body>
<div class="contenedor">
<div class="card">

<div class="top-label">✨ Activación premium para restaurantes</div>

<h2>Crear restaurante</h2>

<input id="nombre" placeholder="Nombre del restaurante" />
<input id="correo" placeholder="Correo" />
<input id="usuario" placeholder="Usuario admin" />
<input id="password" type="password" placeholder="Contraseña" />

<h3>Plan mensual</h3>
<div class="precio">$220000 COP</div>

<h3>Datos de pago</h3>
<input id="cardNumber" placeholder="Número de tarjeta" />
<input id="expMonth" placeholder="Mes (MM)" />
<input id="expYear" placeholder="Año (YYYY)" />
<input id="cvc" placeholder="CVC" />
<input id="cardName" placeholder="Nombre en la tarjeta" />

<button onclick="crearCuentaYPagar()" id="btnPagar">
Crear cuenta y pagar
</button>

<p class="info-text">
Pago seguro con Wompi • Activación inmediata
</p>

<div id="estadoProceso" class="estado"></div>
</div>
</div>

<script>
async function crearCuentaYPagar() {
const btn = document.getElementById("btnPagar");
const estado = document.getElementById("estadoProceso");

btn.disabled = true;
estado.innerHTML = "Iniciando proceso...";

try {
const nombre = document.getElementById("nombre").value.trim();
const correo = document.getElementById("correo").value.trim();
const usuario = document.getElementById("usuario").value.trim();
const password = document.getElementById("password").value.trim();

const cardNumber = document.getElementById("cardNumber").value.trim();
const expMonth = document.getElementById("expMonth").value.trim();
const expYear = document.getElementById("expYear").value.trim();
const cvc = document.getElementById("cvc").value.trim();
const cardName = document.getElementById("cardName").value.trim();

if (!nombre || !correo || !usuario || !password) {
throw new Error("Completa los datos del restaurante");
}

if (!cardNumber || !expMonth || !expYear || !cvc || !cardName) {
throw new Error("Completa los datos de la tarjeta");
}

const publicKey = "pub_prod_Oh0v6IoZ1mad01tKxchx0uTmzN4LVtEy";

estado.innerHTML = "Conectando con Wompi...";

const merchantRes = await fetch(`https://production.wompi.co/v1/merchants/${publicKey}`);
const merchantData = await merchantRes.json();

const acceptanceToken = merchantData?.data?.presigned_acceptance?.acceptance_token;

if (!acceptanceToken) {
console.log("merchantData:", merchantData);
throw new Error("No se obtuvo acceptance token");
}

estado.innerHTML = "Tokenizando tarjeta...";

const tokenRes = await fetch("https://production.wompi.co/v1/tokens/cards", {
method: "POST",
headers: {
"Content-Type": "application/json",
"Authorization": `Bearer ${publicKey}`
},
body: JSON.stringify({
number: cardNumber,
cvc: cvc,
exp_month: expMonth,
exp_year: expYear,
card_holder: cardName
})
});

const tokenData = await tokenRes.json();

if (!tokenData.data) {
console.log("tokenData:", tokenData);
throw new Error("Error tokenizando tarjeta");
}

const paymentMethodToken = tokenData.data.id;

estado.innerHTML = "Creando restaurante...";

const res = await fetch("/api/registro-y-fuente-pago", {
method: "POST",
headers: {
"Content-Type": "application/json"
},
body: JSON.stringify({
nombre,
correo,
usuario,
password,
acceptanceToken,
paymentMethodToken,
customerEmail: correo
})
});

const data = await res.json();

if (!res.ok || !data.ok) {
console.log("Respuesta backend:", data);
throw new Error(data.error || "Error en el servidor");
}

estado.innerHTML = "<span class='ok'>Restaurante creado ✅ Redirigiendo al pago...</span>";

sessionStorage.setItem("registro_usuario", usuario);
sessionStorage.setItem("registro_password", password);
sessionStorage.setItem("registro_restaurantId", data.restauranteId);

setTimeout(() => {
window.location.href = `/pago-suscripcion.html?restaurantId=${encodeURIComponent(data.restauranteId)}`;
}, 1200);

} catch (error) {
console.log("ERROR REAL creando fuente de pago:");
console.log(error);

estado.innerHTML = "<span class='bad'>Error: " + error.message + "</span>";
alert("Error: " + error.message);
} finally {
btn.disabled = false;
}
}
</script>
</body>
</html>
