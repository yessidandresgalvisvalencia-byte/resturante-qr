<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Activar GRUK Empresarial</title><style>body{margin:0;background:#020916;color:#eef7ff;font-family:system-ui}main{max-width:680px;margin:auto;padding:28px}.card{background:#08182c;border:1px solid #183a5b;border-radius:24px;padding:24px}button{width:100%;padding:15px;border:0;border-radius:12px;font-weight:800;background:#31c7ff;color:#02101c}#estado{margin-top:16px}</style></head><body><main><div class="card"><small>GRUK EMPRESARIAL</small><h1>Activar suscripción</h1><p>Plan mensual GRUK Empresarial. El importe y la referencia se calculan exclusivamente en el servidor.</p><button id="pagar">Continuar al pago seguro</button><div id="estado"></div></div></main><script src="https://checkout.wompi.co/widget.js"></script><script>"use strict";const empresaId=new URLSearchParams(location.search).get("empresaId"),btn=document.getElementById("pagar"),estado=document.getElementById("estado");if(!empresaId){btn.disabled=true;estado.textContent="Falta la empresa del onboarding."}btn.onclick=async()=>{btn.disabled=true;estado.textContent="Preparando pago seguro…";try{const r=await fetch("/api/onboarding/empresa/"+encodeURIComponent(empresaId)+"/preparar-pago",{method:"POST",headers:{"Content-Type":"application/json"}}),j=await r.json();if(!r.ok||!j.ok)throw new Error(j.error||"No fue posible preparar el pago");const p=j.pago;new WidgetCheckout({currency:p.currency,amountInCents:p.amountInCents,reference:p.reference,publicKey:p.publicKey,signature:{integrity:p.signature},customerData:{email:p.customerEmail,fullName:p.customerData.fullName},acceptanceToken:p.acceptanceToken}).open(result=>{const st=String(result?.transaction?.status||"").toUpperCase();if(st==="APPROVED"){estado.textContent="Pago recibido. GRUK está verificando la activación en el servidor. Ya puedes iniciar sesión.";setTimeout(()=>location.assign("/login.html"),1800)}else{estado.textContent="El pago no quedó aprobado. Estado: "+(st||"sin confirmar");btn.disabled=false}})}catch(e){estado.textContent=e.message;btn.disabled=false}};</script></body></html>
