<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <link rel="stylesheet" href="style.css">
</head>

<main class="adminContenidoGRUK">

    <h1>Bienvenido a GRUK</h1>

  </div>

  <div id="contenedorModuloGRUK"></div>

<script>

</script>
