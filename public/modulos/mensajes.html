<div class="card">
  <h1>💬 Mensajes Laborales GRUK</h1>
  <p>Comunicación interna entre administrador y empleados.</p>
</div>

<div class="card">
  <h2>💬 Chat general</h2>

  <div
    id="listaMensajesLaboralGRUK"
    style="
      height:420px;
      overflow-y:auto;
      background:#0f172a;
      padding:15px;
      border-radius:14px;
      margin-bottom:15px;
    "
  ></div>

  <div style="display:grid; grid-template-columns:1fr auto; gap:10px; align-items:center;">
    <input
  id="mensajeLaboralTextoGRUK"
  type="text"
  placeholder="Escribe un mensaje..."
  style="width:100%; min-width:0; position:relative; z-index:2;"
  onkeydown="if(event.key==='Enter') enviarMensajeLaboralGRUK()"
>

    <button onclick="enviarMensajeLaboralGRUK()">
      Enviar
    </button>
  </div>
</div>
