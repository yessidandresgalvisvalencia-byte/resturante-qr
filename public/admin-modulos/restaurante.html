<div class="card">
  <h1>🍽 Restaurante</h1>
  <p>Gestiona productos, personal, enlaces del restaurante y códigos QR.</p>
</div>

<div class="card">
  <h3>Links del restaurante</h3>
  <p><strong>Restaurant ID:</strong> <span id="restaurantIdActual"></span></p>

  <a id="linkLogoRestaurante" class="btn-logo">
    Personalizar Logo
  </a>

  <p><strong>Menú cliente:</strong><br>
    <a id="linkMenu" target="_blank"></a>
  </p>

  <p><strong>Cocina:</strong><br>
    <a id="linkCocina" target="_blank"></a>
  </p>

  <p><strong>Caja:</strong><br>
    <a id="linkCaja" target="_blank"></a>
  </p>

  <p><strong>Mesero:</strong><br>
    <a id="linkMesero" target="_blank"></a>
  </p>

  <p><strong>Administrador:</strong><br>
    <a id="linkAdmin" target="_blank"></a>
  </p>
</div>

<div class="card">
  <h3>Agregar producto al menú</h3>

  <label>Nombre del producto</label>
  <input id="nombreProducto" type="text">

  <label>Descripción</label>
  <textarea id="descripcionProducto"></textarea>

  <label>Precio</label>
  <input id="precioProducto" type="number">

  <label>Costo materia prima por unidad</label>
  <input id="costoMateriaProducto" type="number">

  <label>Categoría</label>
  <select id="categoriaProducto">
    <option value="Entradas">Entradas</option>
    <option value="Comida">Comida</option>
    <option value="Bebidas frías">Bebidas frías</option>
    <option value="Bebidas calientes">Bebidas calientes</option>
    <option value="Adiciones">Adiciones</option>
    <option value="Postres">Postres</option>
  </select>

  <label>Guarniciones</label>
  <input id="guarnicionesProducto" type="text">

  <label>Adiciones / extras con precio</label>
  <input id="extrasProducto" type="text">

  <label>URL de imagen</label>
  <input id="imagenProducto" type="text">

  <label>Tiempo estimado base</label>
  <input id="tiempoProducto" type="number" value="10">

  <label>Disponible</label>
  <select id="disponibleProducto">
    <option value="true">Sí</option>
    <option value="false">No</option>
  </select>

  <button id="btnGuardarProducto" onclick="guardarOEditarProducto()">Guardar producto</button>
  <button id="btnCancelarEdicion" onclick="cancelarEdicion()" style="display:none;">Cancelar edición</button>
</div>

<div class="card">
  <h3>Agregar personal</h3>

  <label>Nombre</label>
  <input id="nombrePersonal" type="text">

  <label>Cargo</label>
  <select id="cargoPersonal">
    <option value="mesero">Mesero</option>
    <option value="mesera">Mesera</option>
    <option value="cajero">Cajero</option>
    <option value="cocinero">Cocinero</option>
    <option value="admin">Admin</option>
  </select>

  <label>Estado</label>
  <select id="estadoPersonal">
    <option value="disponible">Disponible</option>
    <option value="ocupado">Ocupado</option>
  </select>

  <label>Usuario</label>
  <input id="usuarioPersonal" type="text">

  <label>Contraseña</label>
  <input id="passwordPersonal" type="text">

  <label>Salario mensual</label>
  <input id="salarioPersonal" type="number">

  <button onclick="agregarPersonal()">Guardar personal</button>
</div>

<h2>Personal del restaurante</h2>
<div id="listaPersonal" class="grid"></div>

<h2>QR por mesa</h2>
<div id="qrs" class="grid"></div>
