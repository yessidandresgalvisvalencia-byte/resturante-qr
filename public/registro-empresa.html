<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crear empresa · GRUK</title><style>body{margin:0;background:#020916;color:#eef7ff;font-family:system-ui}main{max-width:680px;margin:auto;padding:28px}.card{background:#08182c;border:1px solid #183a5b;border-radius:24px;padding:24px}h1{margin-top:0}label{display:block;margin:14px 0 5px}input,select{width:100%;box-sizing:border-box;padding:13px;border-radius:12px;border:1px solid #31516d;background:#071321;color:white}button{width:100%;margin-top:20px;padding:14px;border:0;border-radius:12px;font-weight:800;background:#31c7ff;color:#02101c}.msg{min-height:24px}</style></head><body><main><div class="card"><small>GRUK EMPRESARIAL</small><h1>Inscribir mi empresa</h1><p>Una cuenta GRUK para restaurantes, retail, servicios y otros negocios.</p><form id="f"><label>Empresa</label><input id="empresa" required maxlength="160"><label>Tipo de negocio</label><select id="tipo"><option value="restaurante">Restaurante</option><option value="retail">Retail / comercio</option><option value="servicios">Servicios</option><option value="otro">Otro</option></select><label>Correo empresarial</label><input id="correo" type="email" required><label>Tu nombre</label><input id="dueno" required><label>Usuario</label><input id="usuario" required minlength="3"><label>Contraseña</label><input id="password" type="password" required minlength="12"><label>Sede principal</label><input id="sede" value="Principal" required><label>Dirección (opcional)</label><input id="direccion"><label>Empleados actuales</label><input id="empleados" type="number" min="0" value="0"><button>Crear empresa</button><p id="msg" class="msg"></p></form></div></main><script>"use strict";const $=x=>document.getElementById(x);$("f").onsubmit=async e=>{e.preventDefault();const b=e.submitter;b.disabled=true;$("msg").textContent="Creando empresa de forma segura…";try{const r=await fetch("/api/onboarding/empresa",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({nombreEmpresa:$("empresa").value,tipoNegocio:$("tipo").value,correo:$("correo").value,nombreDueno:$("dueno").value,usuario:$("usuario").value,password:$("password").value,nombreSede:$("sede").value,direccion:$("direccion").value,empleadosActuales:Number($("empleados").value)})});const j=await r.json();if(!r.ok)throw new Error(j.error||"No fue posible crear la empresa");sessionStorage.setItem("gruk_onboarding_empresa",JSON.stringify(j.onboarding));$("msg").textContent="Empresa creada. Continuando con la suscripción…";location.assign("/pago-suscripcion.html?empresaId="+encodeURIComponent(j.onboarding.empresaId));}catch(x){$("msg").textContent=x.message;b.disabled=false}};</script></body></html>
