<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mi empresa · GRUK</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" id="gruk-design-system" href="/gruk-design.css?v=3000-reference-1"><style>.workspace-top{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}.workspace-top button{min-height:44px;background:#172635;color:#e7eef5;border:1px solid #42576a;border-radius:8px;padding:10px 16px;cursor:pointer}.workspace-list small{display:block;color:var(--g-muted);margin-top:5px}.workspace-list a span:last-child{color:var(--g-accent)}@media(min-width:1025px){.gruk-workspace.nav-collapsed .menuAdminGRUK{transform:translateX(-100%)}.gruk-workspace.nav-collapsed .adminContenidoGRUK{margin-left:0;padding-top:80px}}.enterprise-metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:16px 0}.enterprise-metrics .card{padding:16px;min-width:0}.enterprise-metrics h3{font-size:14px}.enterprise-metrics p{font-size:20px;overflow-wrap:anywhere}</style></head><body class="gruk-workspace"><button class="btnMenuGRUK" id="toggle" aria-label="Alternar navegación" aria-controls="menuAdminGRUK" aria-expanded="false"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button><aside class="menuAdminGRUK" id="menuAdminGRUK"><div class="gruk-brand"><svg viewBox="0 0 64 64" aria-hidden="true"><path fill="#00d8c2" d="M33 3 57 11 50 24 34 19 18 29 19 43 32 49 43 40 31 40 31 29 59 29 55 49 32 62 9 51 3 30 12 12Z"/><path fill="#078d93" d="M19 43 32 49 43 40 31 40 31 29 59 29 55 49 32 62Z"/></svg><div><h2>GRUK</h2><strong>Empresarial</strong><small>Sistema de gestión integral</small></div></div><nav id="nav" aria-label="Módulos de empresa" hidden><a href="/panel-empresa.html" aria-current="page">Inicio</a></nav></aside><main class="adminContenidoGRUK"><header class="workspace-heading workspace-top"><div><p class="workspace-kicker">Espacio de trabajo</p><h1 id="empresa">Mi empresa</h1><p id="estado" role="status" class="workspace-muted">Validando tu sesión…</p></div><button id="salir">Cerrar sesión</button></header><section id="menu" hidden><p id="gratis" class="workspace-kicker" hidden>Acceso gratis por ahora · Sin cobro de suscripción</p><h2>Centro de operaciones</h2><p class="workspace-muted" id="sector"></p><div class="workspace-list" id="modulos"></div><p class="workspace-muted" id="aviso"></p><section id="module-detail" class="card" hidden aria-live="polite"><h2 id="module-title"></h2><p id="module-message" role="status"></p><div id="module-data"></div><button type="button" id="module-back">Volver al centro de operaciones</button></section></section></main><script>
"use strict";
const $=id=>document.getElementById(id);
const token=sessionStorage.getItem("grukEnterpriseToken")||localStorage.getItem("grukAuthToken");
function salir(){for(const k of ["grukEnterpriseToken","grukEnterpriseIdentity"])sessionStorage.removeItem(k);for(const k of ["grukAuthToken","adminRestaurantId","adminUsuario"])localStorage.removeItem(k);location.replace("/login-empresa.html")}
$("salir").onclick=salir;
let identity, requestVersion=0;
function openModule(path,label){$("module-title").textContent=label;loadEnterpriseModule(path);$("module-detail").hidden=false;$("modulos").hidden=true;for(const a of $("nav").querySelectorAll("a")){if(a.getAttribute("href")==="#"+path)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current")}if(!wide.matches){$("menuAdminGRUK").classList.remove("abierto");navState()}$("module-detail").scrollIntoView({block:"nearest"})}
$("module-back").onclick=()=>{requestVersion++;$("module-data").replaceChildren();$("module-detail").hidden=true;$("modulos").hidden=false;for(const a of $("nav").querySelectorAll("a"))a.removeAttribute("aria-current");$("nav").querySelector("a").setAttribute("aria-current","page")};

async function loadEnterpriseModule(path){
 const version=++requestVersion, target=$("module-data"), status=$("module-message");
 target.replaceChildren();status.textContent="Consultando información de tu empresa…";
 const id=encodeURIComponent(identity.empresaId);
 const financial=["centro-control","finanzas","reportes"].includes(path);
 if(!financial&&path!=="inventario"){status.textContent="La operación de este módulo aún no está integrada.";return}
 try{
 const response=await fetch(financial?"/api/finanzas/resumen/"+id+"?precision=exact":"/api/productos-servicios/empresa/"+id,{headers:{Authorization:"Bearer "+token},cache:"no-store"});
 if(version!==requestVersion)return;
 if(response.status===401){salir();return}
 if(!response.ok)throw Error("No se pudo consultar la información ("+response.status+").");
 const data=await response.json();if(version!==requestVersion)return;
 if(!data.ok)throw Error("Consulta no disponible.");
 const grid=document.createElement("div");grid.className="enterprise-metrics";
 function metric(label,value){const card=document.createElement("section"),h=document.createElement("h3"),p=document.createElement("p");card.className="card";h.textContent=label;p.textContent=value;card.append(h,p);grid.append(card)}
 if(financial){
 const summary=data.resumenExacto;if(!summary)throw Error("Resumen no disponible.");
 for(const [key,label] of [["ingresos","Ingresos registrados"],["gastos","Gastos registrados"],["resultado","Resultado neto"]]){if(typeof summary[key]!=="string")throw Error("Importe no disponible.");metric(label,summary[key]+" COP")}
 status.textContent="Resumen histórico · Ventas pagadas y gastos registrados. Consulta de solo lectura.";
 }else{
 if(!Array.isArray(data.catalogo))throw Error("Catálogo no disponible.");
 for(const item of data.catalogo){metric(item.nombre,(item.tipo==="servicio"?"Servicio":"Producto")+" · Precio: "+String(item.precioVenta)+" COP")}
 status.textContent=data.catalogo.length?"Catálogo empresarial · Consulta de solo lectura; no representa existencias físicas.":"No hay productos o servicios registrados en el catálogo.";
 }
 target.append(grid);
 }catch(error){if(version===requestVersion)status.textContent=error.message||"No se pudo consultar el módulo."}
}

const wide=matchMedia("(min-width:1025px)");
function navState(){const open=wide.matches?!document.body.classList.contains("nav-collapsed"):$("menuAdminGRUK").classList.contains("abierto");$("toggle").setAttribute("aria-expanded",String(open));$("menuAdminGRUK").inert=!open}
$("toggle").onclick=()=>{if(wide.matches)document.body.classList.toggle("nav-collapsed");else $("menuAdminGRUK").classList.toggle("abierto");navState()};wide.addEventListener("change",navState);navState();
(async()=>{if(!token){salir();return}try{const res=await fetch("/api/onboarding/me",{headers:{Authorization:"Bearer "+token},cache:"no-store"});if(res.status===401||res.status===403){salir();return}if(!res.ok)throw Error("session");const data=await res.json();if(!data.ok)throw Error("session");identity=data;$("empresa").textContent=data.empresaNombre||"Mi empresa";$("estado").textContent=data.nombre+" · "+data.rol;$("gratis").hidden=!data.gratis;const tipos={restaurante:"Gastronomía",retail:"Comercio",servicios:"Servicios",otro:"Actividad empresarial"};$("sector").textContent=tipos[data.tipoNegocio]||"Actividad pendiente de confirmar";const m=data.modulos||{};const items=[["inteligencia","Centro de control","Gestiona tu operación","centro-control"],["inventario","Inventario","Consulta el catálogo de productos y servicios","inventario"],["finanzas","Finanzas empresariales","Revisa información de tu negocio","finanzas"],["inteligencia","Reportes","Revisa indicadores de la empresa","reportes"],["restaurante","Restaurante","Operación gastronómica","restaurante"]];for(const [flag,label,desc,path] of items){if(m[flag]!==true||(flag==="restaurante"&&data.tipoNegocio!=="restaurante"))continue;const href="#"+path;const nav=document.createElement("a");nav.href=href;nav.textContent=label;nav.addEventListener("click",e=>{e.preventDefault();openModule(path,label)});$("nav").append(nav);const a=document.createElement("a");a.href=href;a.addEventListener("click",e=>{e.preventDefault();openModule(path,label)});const wrap=document.createElement("span"),title=document.createElement("strong"),small=document.createElement("small"),arrow=document.createElement("span");title.textContent=label;small.textContent=desc;arrow.textContent="→";arrow.setAttribute("aria-hidden","true");wrap.append(title,small);a.append(wrap,arrow);$("modulos").append(a)}$("aviso").textContent="Información de tu empresa · Consulta segura";$("nav").hidden=false;$("menu").hidden=false}catch(e){$("estado").textContent="No pudimos verificar la sesión. Revisa tu conexión."}})();
</script></body></html>
