<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mi empresa · GRUK</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/gruk-design.css"><style>.workspace-top{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}.workspace-top button{min-height:44px;background:#172635;color:#e7eef5;border:1px solid #42576a;border-radius:8px;padding:10px 16px;cursor:pointer}.workspace-list small{display:block;color:var(--g-muted);margin-top:5px}.workspace-list a span:last-child{color:var(--g-accent)}@media(min-width:1025px){.gruk-workspace.nav-collapsed .menuAdminGRUK{transform:translateX(-100%)}.gruk-workspace.nav-collapsed .adminContenidoGRUK{margin-left:0;padding-top:80px}}</style></head><body class="gruk-workspace"><button class="btnMenuGRUK" id="toggle" aria-label="Alternar navegación" aria-controls="menuAdminGRUK" aria-expanded="false"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button><aside class="menuAdminGRUK" id="menuAdminGRUK"><h2>GRUK</h2><p class="workspace-kicker">Empresarial</p><nav id="nav" aria-label="Módulos de empresa" hidden><a href="/panel-empresa.html" aria-current="page">Inicio</a></nav></aside><main class="adminContenidoGRUK"><header class="workspace-heading workspace-top"><div><p class="workspace-kicker">Espacio de trabajo</p><h1 id="empresa">Mi empresa</h1><p id="estado" role="status" class="workspace-muted">Validando tu sesión…</p></div><button id="salir">Cerrar sesión</button></header><section id="menu" hidden><p id="gratis" class="workspace-kicker" hidden>Acceso gratis por ahora · Sin cobro de suscripción</p><h2>Centro de operaciones</h2><p class="workspace-muted" id="sector"></p><div class="workspace-list" id="modulos"></div><p class="workspace-muted" id="aviso"></p></section></main><script>
"use strict";
const $=id=>document.getElementById(id);
const token=sessionStorage.getItem("grukEnterpriseToken")||localStorage.getItem("grukAuthToken");
function salir(){for(const k of ["grukEnterpriseToken","grukEnterpriseIdentity"])sessionStorage.removeItem(k);for(const k of ["grukAuthToken","adminRestaurantId","adminUsuario"])localStorage.removeItem(k);location.replace("/login-empresa.html")}
$("salir").onclick=salir;
const wide=matchMedia("(min-width:1025px)");
function navState(){const open=wide.matches?!document.body.classList.contains("nav-collapsed"):$("menuAdminGRUK").classList.contains("abierto");$("toggle").setAttribute("aria-expanded",String(open));$("menuAdminGRUK").inert=!open}
$("toggle").onclick=()=>{if(wide.matches)document.body.classList.toggle("nav-collapsed");else $("menuAdminGRUK").classList.toggle("abierto");navState()};wide.addEventListener("change",navState);navState();
(async()=>{if(!token){salir();return}try{const res=await fetch("/api/onboarding/me",{headers:{Authorization:"Bearer "+token},cache:"no-store"});if(res.status===401||res.status===403){salir();return}if(!res.ok)throw Error("session");const data=await res.json();if(!data.ok)throw Error("session");$("empresa").textContent=data.empresaNombre||"Mi empresa";$("estado").textContent=data.nombre+" · "+data.rol;$("gratis").hidden=!data.gratis;const tipos={restaurante:"Gastronomía",retail:"Comercio",servicios:"Servicios",otro:"Actividad empresarial"};$("sector").textContent=tipos[data.tipoNegocio]||"Actividad pendiente de confirmar";const m=data.modulos||{};const items=[["inteligencia","Centro de control","Gestiona tu operación","centro-control"],["inventario","Inventario","Consulta y administra existencias","inventario"],["finanzas","Finanzas empresariales","Revisa información de tu negocio","finanzas"],["inteligencia","Reportes","Revisa indicadores de la empresa","reportes"],["restaurante","Restaurante","Operación gastronómica","restaurante"]];for(const [flag,label,desc,path] of items){if(m[flag]!==true||(flag==="restaurante"&&data.tipoNegocio!=="restaurante"))continue;const href="/modulos/"+path+".html";const nav=document.createElement("a");nav.href=href;nav.textContent=label;$("nav").append(nav);const a=document.createElement("a");a.href=href;const wrap=document.createElement("span"),title=document.createElement("strong"),small=document.createElement("small"),arrow=document.createElement("span");title.textContent=label;small.textContent=desc;arrow.textContent="→";arrow.setAttribute("aria-hidden","true");wrap.append(title,small);a.append(wrap,arrow);$("modulos").append(a)}$("aviso").textContent="Las herramientas disponibles dependen de la configuración de tu empresa.";$("nav").hidden=false;$("menu").hidden=false}catch(e){$("estado").textContent="No pudimos verificar la sesión. Revisa tu conexión."}})();
</script></body></html>
