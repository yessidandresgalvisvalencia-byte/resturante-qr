<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Administrador</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="contenedor">
    <h1>Ingreso Administrador</h1>

    <div class="card">
      <label>Usuario</label>
      <input id="usuario" type="text" placeholder="Usuario">

      <label>Contraseña</label>
      <input id="password" type="password" placeholder="Contraseña">

      <button onclick="loginAdmin()">Ingresar</button>
    </div>


  </div>

  <script>
    async function loginAdmin() {
      try {
        const usuario = document.getElementById("usuario").value.trim();
        const password = document.getElementById("password").value.trim();

        if (!usuario || !password) {
          alert("Completa usuario y contraseña");
          return;
        }

        const res = await fetch("/api/admin/login", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ usuario, password })
        });

        const data = await res.json();

        if (!res.ok || !data.ok) {
          alert(data.error || "Usuario o contraseña incorrectos");
          return;
        }

        localStorage.setItem("adminRestaurantId", data.restaurantId);
        localStorage.setItem("adminUsuario", data.usuario || usuario);

        if (data.token) {
          localStorage.setItem("grukAuthToken", data.token);
        } else {
          localStorage.removeItem("grukAuthToken");
        }

        window.location.href = `/admin.html?restaurantId=${data.restaurantId}`;
      } catch (error) {
        console.log("Error login:", error);
        alert("Error iniciando sesión");
      }
    }

    
  </script>
  <script>
  window.addEventListener("DOMContentLoaded", () => {
    const usuario = sessionStorage.getItem("login_usuario_prefill") || "";
    const password = sessionStorage.getItem("login_password_prefill") || "";

    const inputUsuario =
      document.getElementById("usuario") ||
      document.getElementById("username") ||
      document.querySelector('input[type="text"]');

    const inputPassword =
      document.getElementById("password") ||
      document.querySelector('input[type="password"]');

    if (inputUsuario) inputUsuario.value = usuario;
    if (inputPassword) inputPassword.value = password;
  });
</script>

</body>
</html>
