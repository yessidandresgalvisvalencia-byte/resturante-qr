<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Administrador</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="contenedor">
    <h1>Ingreso Administrador</h1>

    <div class="card">
      <label>Usuario</label>
      <input id="usuario" type="text" placeholder="Usuario">

      <label>Contraseña</label>
      <input id="password" type="password" placeholder="Contraseña">

      <button onclick="loginAdmin()">Ingresar</button>
    </div>


  </div>

  <script>
    async function loginAdmin() {
      try {
        const usuario =
          document.getElementById("usuario").value.trim();

        const password =
          document.getElementById("password").value;

        if (!usuario || !password) {
          alert("Completa usuario y contraseña");
          return;
        }

        let res =
          await fetch("/api/usuarios/login", {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body:
              JSON.stringify({
                usuario,
                password
              })
          });

        let data =
          await res.json();

        if (!res.ok || !data.ok) {
          res =
            await fetch("/api/admin/login", {
              method: "POST",
              headers: {
                "Content-Type": "application/json"
              },
              body:
                JSON.stringify({
                  usuario,
                  password
                })
            });

          data =
            await res.json();
        }

        if (!res.ok || !data.ok) {
          alert(
            data.error ||
            "Usuario o contraseña incorrectos"
          );
          return;
        }

        const restaurantId =
          data.usuario?.restauranteId ||
          data.restaurantId ||
          "";

        if (restaurantId) {
          localStorage.setItem(
            "adminRestaurantId",
            restaurantId
          );
        } else {
          localStorage.removeItem(
            "adminRestaurantId"
          );
        }

        localStorage.setItem(
          "adminUsuario",
          data.usuario?.usuario ||
          data.usuario ||
          usuario
        );

        if (data.empresa) {
          localStorage.setItem(
            "grukEmpresaId",
            data.empresa.empresaId || ""
          );

          localStorage.setItem(
            "grukTipoNegocio",
            data.empresa.tipoNegocio || ""
          );

          localStorage.setItem(
            "grukVertical",
            data.empresa.vertical || ""
          );

          localStorage.setItem(
            "grukModulos",
            JSON.stringify(
              data.empresa.modulos || {}
            )
          );
        }

        if (data.token) {
          localStorage.setItem(
            "grukAuthToken",
            data.token
          );
        } else {
          localStorage.removeItem(
            "grukAuthToken"
          );
        }

        const destino =
          restaurantId
            ? `/admin.html?restaurantId=${encodeURIComponent(
                restaurantId
              )}`
            : "/admin.html";

        window.location.href =
          destino;
      } catch (error) {
        console.log(
          "Error login:",
          error
        );

        alert(
          "Error iniciando sesión"
        );
      }
    }
    
  </script>
  <script>
  window.addEventListener("DOMContentLoaded", () => {
    const usuario = sessionStorage.getItem("login_usuario_prefill") || "";
    const password = sessionStorage.getItem("login_password_prefill") || "";

    const inputUsuario =
      document.getElementById("usuario") ||
      document.getElementById("username") ||
      document.querySelector('input[type="text"]');

    const inputPassword =
      document.getElementById("password") ||
      document.querySelector('input[type="password"]');

    if (inputUsuario) inputUsuario.value = usuario;
    if (inputPassword) inputPassword.value = password;
  });
</script>

</body>
</html>
