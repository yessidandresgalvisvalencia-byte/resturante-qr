<script>
(function(){const status=document.getElementById("gruk-network");function network(){status.textContent=navigator.onLine?"Red disponible":"Sin conexión";document.getElementById("gruk-footer-network").textContent=status.textContent}window.addEventListener("online",network);window.addEventListener("offline",network);network();document.getElementById("gruk-user").textContent=localStorage.getItem("adminUsuario")||"Cuenta empresarial";document.getElementById("gruk-logout").onclick=()=>{for(const k of ["grukAuthToken","adminRestaurantId","adminUsuario"])localStorage.removeItem(k);for(const k of ["grukEnterpriseToken","grukEnterpriseIdentity"])sessionStorage.removeItem(k);location.replace("/login-empresa.html")};const nav=document.getElementById("menuAdminGRUK");const content=document.getElementById("contenidoPrincipalGRUK");function active(){for(const b of nav.querySelectorAll("button")){if(b.getAttribute("onclick")=== "cargarModuloGRUK('"+content.dataset.moduloActual+"')")b.setAttribute("aria-current","page");else b.removeAttribute("aria-current")}}new MutationObserver(active).observe(content,{attributes:true,attributeFilter:["data-modulo-actual"]});active()})();
