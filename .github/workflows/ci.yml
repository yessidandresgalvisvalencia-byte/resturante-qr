name: GRUK Gate
on:
  workflow_dispatch:
  pull_request:
    branches: [main, feature/finanzas-personales]
  push:
    branches: [feature/finanzas-personales]
permissions:
  contents: read
concurrency:
  group: gruk-gate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref == 'feature/finanzas-personales' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Start MongoDB replica set
        shell: bash
        run: |
          set -euo pipefail
          diagnostic() {
            echo "::group::MongoDB Docker diagnostic"
            docker ps -a --filter name=gruk-mongo || true
            docker inspect gruk-mongo --format 'Status={{.State.Status}} ExitCode={{.State.ExitCode}} OOMKilled={{.State.OOMKilled}} Error={{.State.Error}}' || true
            docker logs --tail 100 gruk-mongo || true
            echo "::endgroup::"
          }
          trap 'diagnostic' ERR
          # MongoDB 8.x fails startup on Linux kernel 6.19+ (SERVER-121912). Test replica-set semantics on supported MongoDB 7.0 instead.
          docker run -d --name gruk-mongo -p 27017:27017 mongo:7.0.41 --replSet rs0 --bind_ip_all
          for i in {1..45}; do
            if ! docker inspect -f '{{.State.Running}}' gruk-mongo | grep -qx true; then
              echo "::error::MongoDB container exited before readiness"
              diagnostic
              exit 1
            fi
            if docker exec gruk-mongo mongosh --quiet --eval 'db.adminCommand("ping").ok' 2>/dev/null | grep -qx 1; then break; fi
            sleep 1
          done
          docker exec gruk-mongo mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"127.0.0.1:27017"}]})'
          for i in {1..45}; do
            if docker exec gruk-mongo mongosh --quiet --eval 'db.hello().isWritablePrimary' 2>/dev/null | grep -qx true; then exit 0; fi
            sleep 1
          done
          echo "::error::MongoDB replica set did not become PRIMARY"
          diagnostic
          exit 1
      - name: Production gate
        env:
          NODE_ENV: test
          TEST_MONGO_URI: mongodb://127.0.0.1:27017/?replicaSet=rs0&directConnection=true
          GRUK_TEST_MONGO_URI: mongodb://127.0.0.1:27017/gruk_offline_test?replicaSet=rs0&directConnection=true
          GRUK_TEST_DB_CONFIRM: SOLO_PRUEBAS_LOCALES
        shell: bash
        run: |
          set -o pipefail
          npm run gate 2>&1 | tee "${RUNNER_TEMP}/gruk-gate.log"
      - name: Verificar ledger personal V81 contra MongoDB real
        env:
          NODE_ENV: test
          GRUK_V81_TEST_MONGO_URI: mongodb://127.0.0.1:27017/gruk_v81_test_integracion?replicaSet=rs0&directConnection=true
        shell: bash
        run: |
          set -o pipefail
          npm run test:personal:mongo-idempotencia 2>&1 | tee "${RUNNER_TEMP}/gruk-v81-mongo.log"
      - name: Conservar diagnóstico de CI
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gruk-gate-diagnostics-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/gruk-gate.log
            ${{ runner.temp }}/gruk-v81-mongo.log
          if-no-files-found: ignore
          retention-days: 3
