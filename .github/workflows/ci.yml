name: GRUK Production Gate
on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/finanzas-personales]
permissions:
  contents: read
concurrency:
  group: gruk-gate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gate:
    name: GRUK Production Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run gate
