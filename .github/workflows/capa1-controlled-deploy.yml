name: GRUK Capa 1 Controlled Deploy
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gruk-capa1-controlled-deploy
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    environment: gruk-capa1-staging
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Resolve expected Git revision
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Restrict deploys to integration branch
        run: |
          test "${{ github.ref }}" = "refs/heads/gruk/capa1-offline-core-v4"
      - name: Check staging configuration exists
        env:
          HOOK: ${{ secrets.GRUK_CAPA1_STAGING_DEPLOY_HOOK }}
          URL: ${{ vars.GRUK_CAPA1_STAGING_URL }}
          ROLLBACK_HOOK: ${{ secrets.GRUK_CAPA1_STAGING_ROLLBACK_HOOK }}
        run: |
          test -n "$HOOK" || { echo "Missing staging hook"; exit 1; }
          test -n "$URL" || { echo "Missing staging URL"; exit 1; }
          test -n "$ROLLBACK_HOOK" || { echo "Missing rollback hook"; exit 1; }
          case "$URL" in https://*) ;; *) echo "Staging URL must use HTTPS"; exit 1;; esac
      - name: Install and syntax gate
        run: |
          npm ci
          npm run check:syntax
          node --test test/gruk/capa1-offline*.test.js test/gruk/capa1-ledger*.test.js
      - name: Block vulnerable production dependency tree
        run: npm audit --omit=dev --audit-level=high
      - name: Verify Docker image and Compose
        run: |
          docker build --target production -t gruk-capa1-staging:${{ github.sha }} .
          docker compose --env-file .env.example config --quiet
      - name: Request staging deployment
        id: deploy
        env:
          HOOK: ${{ secrets.GRUK_CAPA1_STAGING_DEPLOY_HOOK }}
        run: |
          echo "attempted=true" >> "$GITHUB_OUTPUT"
          curl --fail --show-error --silent --max-time 30 --retry 2 -X POST "$HOOK"
      - name: Confirm actual staging health
        env:
          BASE_URL: ${{ vars.GRUK_CAPA1_STAGING_URL }}
          EXPECTED_SHA: ${{ steps.revision.outputs.sha }}
        run: |
          for attempt in $(seq 1 30); do
            if curl -fSs --max-time 8 "${BASE_URL%/}/health" | node -e '
              let b="";process.stdin.on("data",c=>b+=c).on("end",()=>{
                try {const j=JSON.parse(b);process.exit(j.status==="ok" && j.db==="connected" && j.revision===process.env.EXPECTED_SHA?0:1)}
                catch {process.exit(1)}
              })'; then
              exit 0
            fi
            sleep 10
          done
          echo "Staging /health did not confirm the expected deployment revision"
          exit 1
      - name: Attempt rollback using configured safe hook
        if: failure() && steps.deploy.outputs.attempted == 'true'
        env:
          HOOK: ${{ secrets.GRUK_CAPA1_STAGING_ROLLBACK_HOOK }}
        run: |
          if test -n "$HOOK"; then
            curl --fail --show-error --silent --max-time 30 -X POST "$HOOK"
          else
            echo "Missing rollback hook"
            exit 1
          fi
