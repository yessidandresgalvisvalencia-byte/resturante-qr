name: GRUK propuesta temporal parches DoS 2026
on:
  pull_request:
    paths:
      - '.github/workflows/gruk-parches-dos-candidato.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  resolver-y-auditar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm
      - name: Actualizar manifiesto y lockfile mediante npm (no manual)
        run: |
          npm pkg set 'dependencies.multer=^2.5.0' 'overrides.body-parser=^2.4.0'
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Confirmar lockfile reproducible
        run: |
          npm ci --ignore-scripts --no-fund --no-audit
          node - <<'NODE'
          const p=require('./package-lock.json');
          if(p.packages['node_modules/multer']?.version!=='2.5.0')throw Error('Multer sin parche');
          if(p.packages['node_modules/body-parser']?.version!=='2.4.0')throw Error('Body-parser sin parche');
          console.log('Dependencias parcheadas presentes en lockfile');
          NODE
      - name: Auditar dependencias de produccion
        run: npm audit --omit=dev --audit-level=low
      - name: Pruebas de compatibilidad del repositorio compartido
        run: |
          npm run check:syntax
          node --test test/gruk/registrar-obligacion-prevista-personal.test.js test/gruk/alta-obligacion-no-caja-personal.test.js
      - name: Commit exacto a rama PR (nunca producción)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feature/fp-hormiga-creditos-separados-20261020'
        env:
          TARGET_BRANCH: feature/fp-hormiga-creditos-separados-20261020
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --exit-code && exit 0 || true
          git commit -m "fix(security): actualizar multer y body-parser con lockfile npm auditado"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
      - name: Exportar par sin editar repositorio fuente
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gruk-lockfile-dos-candidato
          path: |
            package.json
            package-lock.json
          retention-days: 3
