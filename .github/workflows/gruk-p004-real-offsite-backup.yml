name: GRUK P0-04 Encrypted Offsite Backup and Isolated Restore

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/gruk/p0-04-real-offsite-backup-restore.sh'
      - 'test/gruk/p0-04-real-offsite-backup.test.js'
      - '.github/workflows/gruk-p004-real-offsite-backup.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/gruk/p0-04-real-offsite-backup-restore.sh'
      - 'test/gruk/p0-04-real-offsite-backup.test.js'
      - '.github/workflows/gruk-p004-real-offsite-backup.yml'
permissions:
  contents: read

concurrency:
  group: gruk-p004-backup-drill
  cancel-in-progress: false

jobs:
  validate:
    name: Ensure backup/restore procedure cannot touch other databases
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          bash -n scripts/gruk/p0-04-real-offsite-backup-restore.sh
          node --test test/gruk/p0-04-real-offsite-backup.test.js
