name: GRUK Offline Browser Persistence
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  indexeddb-browser:
    name: Real Chromium IndexedDB persistence
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install isolated browser test dependency
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Install Chromium browser
        run: npx playwright install --with-deps chromium
      - name: Reopen browser after 20 offline events
        run: node test/e2e/offline-indexeddb-restart.cjs
