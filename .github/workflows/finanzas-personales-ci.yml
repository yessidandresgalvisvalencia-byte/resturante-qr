name: GRUK Finanzas Personales - Seguridad y Pruebas
on:
  push:
    branches:
      - feature/finanzas-personales
  pull_request:
    paths:
      - 'modules/finanzas-personales/**'
      - 'test/gruk/**'
      - 'public/finanzas-personales.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/finanzas-personales-ci.yml'
      - 'scripts/resumen-auditoria-personal.js'
permissions:
  contents: read
jobs:
  pruebas-financieras:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Instalar dependencias reproducibles
        run: npm ci
      - name: Comprobar sintaxis y suite financiera
        run: npm run build:personal
  auditoria-dependencias:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Identificar paquetes vulnerables y bloquear severidad alta
        shell: bash
        run: |
          set +e
          npm audit --audit-level=high --json > audit-finanzas.json
          status=$?
          set -e
          node scripts/resumen-auditoria-personal.js audit-finanzas.json >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Adjuntar evidencia del escaneo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auditoria-dependencias-finanzas
          path: audit-finanzas.json
          if-no-files-found: ignore
          retention-days: 7
