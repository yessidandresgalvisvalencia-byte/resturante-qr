name: GRUK Finanzas Personales - Seguridad y Pruebas
on:
  push:
    branches:
      - feature/finanzas-personales
  pull_request:
    paths:
      - 'modules/finanzas-personales/**'
      - 'test/gruk/**'
      - 'public/finanzas-personales.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/finanzas-personales-ci.yml'
      - 'scripts/resumen-auditoria-personal.js'
permissions:
  contents: read
jobs:
  pruebas-financieras:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Instalar dependencias reproducibles
        run: npm ci --omit=dev
      - name: Comprobar sintaxis y suite financiera
        shell: bash
        run: |
          set -o pipefail
          npm run check:personal 2>&1 | tee check-personal-v81.log
          npm run test:finanzas-personales 2>&1 | tee pruebas-finanzas-v81.log
      - name: Conservar evidencia de pruebas y sintaxis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencia-suite-financiera-v81
          path: |
            check-personal-v81.log
            pruebas-finanzas-v81.log
          if-no-files-found: ignore
          retention-days: 14
  auditoria-dependencias:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --omit=dev
      - name: Identificar paquetes vulnerables y bloquear severidad alta
        shell: bash
        run: |
          set +e
          npm audit --omit=dev --audit-level=high --json > audit-finanzas.json
          status=$?
          set -e
          node scripts/resumen-auditoria-personal.js audit-finanzas.json >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Adjuntar evidencia del escaneo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auditoria-dependencias-produccion-finanzas
          path: audit-finanzas.json
          if-no-files-found: ignore
          retention-days: 7

  auditoria-desarrollo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Instalar dependencias incluyendo desarrollo
        run: npm ci
      - name: Informar riesgos de desarrollo sin ocultarlos
        shell: bash
        run: |
          set +e
          npm audit --audit-level=high --json > audit-desarrollo-finanzas.json
          set -e
          node scripts/resumen-auditoria-personal.js audit-desarrollo-finanzas.json >> "$GITHUB_STEP_SUMMARY" || true
      - name: Guardar evidencia de dependencias de desarrollo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auditoria-dependencias-desarrollo-finanzas
          path: audit-desarrollo-finanzas.json
          if-no-files-found: ignore
          retention-days: 7

  concurrencia-mongo:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Instalar dependencias de producción
        run: npm ci --omit=dev
      - name: Iniciar MongoDB temporal con replica set
        shell: bash
        run: |
          docker run --detach --name gruk-v81-mongo \
            --publish 127.0.0.1:27017:27017 \
            mongo:7 --replSet rs0 --bind_ip_all
          for i in $(seq 1 40); do
            if docker exec gruk-v81-mongo mongosh --quiet --eval "db.adminCommand({ping:1}).ok" 2>/dev/null | grep -q 1; then
              break
            fi
            sleep 1
          done
          docker exec gruk-v81-mongo mongosh --quiet --eval \
            "rs.initiate({_id:'rs0',members:[{_id:0,host:'127.0.0.1:27017'}]})"
          for i in $(seq 1 40); do
            if docker exec gruk-v81-mongo mongosh --quiet --eval "db.hello().isWritablePrimary" 2>/dev/null | grep -q true; then
              exit 0
            fi
            sleep 1
          done
          echo "MongoDB de pruebas no llegó a PRIMARY" >&2
          exit 1
      - name: Validar concurrencia real y saldos intactos
        shell: bash
        env:
          TEST_MONGO_URI: mongodb://127.0.0.1:27017/?directConnection=true
          GRUK_TEST_DB_CONFIRM: SOLO_PRUEBAS_LOCALES
        run: |
          set -o pipefail
          node --test test/gruk/confirmacion-vinculo-mongo-concurrencia.test.js test/gruk/decision-proof-concurrency.test.js 2>&1 | tee prueba-mongo-v81.log
      - name: Exigir ambas pruebas Mongo ejecutadas sin omisiones
        run: node scripts/verificar-evidencia-mongo-v81.js prueba-mongo-v81.log
      - name: Adjuntar evidencia de concurrencia MongoDB
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencia-concurrencia-mongo-v81
          path: prueba-mongo-v81.log
          if-no-files-found: ignore
          retention-days: 14
      - name: Detener MongoDB temporal
        if: always()
        run: docker rm --force gruk-v81-mongo || true
