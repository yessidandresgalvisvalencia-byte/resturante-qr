name: GRUK Dependency Remediation Candidate
on:
  workflow_dispatch:
  push:
    branches: [gruk/capa1-offline-core-v4]
    paths:
      - ".github/workflows/capa1-remediation-candidate.yml"
  pull_request:
    paths:
      - ".github/workflows/capa1-remediation-candidate.yml"
permissions:
  contents: write
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Compute non-breaking npm remediation proposal
        run: |
          npm ci
          npm audit fix --package-lock-only --ignore-scripts --no-fund || true
          npm audit --omit=dev --json > candidate-audit.json || true
          node -e 'const x=require("./candidate-audit.json"); console.log(JSON.stringify(x.metadata?.vulnerabilities||{}));'
      - name: Test candidate dependency tree
        run: |
          npm ci
          npm run check:syntax
          node --test test/gruk/capa1-offline*.test.js test/gruk/capa1-ledger*.test.js
      - name: Upload proposed lockfile only (do not auto-merge)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gruk-remediation-candidate
          path: |
            package-lock.json
            candidate-audit.json

      - name: Commit clean remediation candidate on integration branch only
        if: (github.event_name == 'push' && github.ref == 'refs/heads/gruk/capa1-offline-core-v4') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'gruk/capa1-offline-core-v4')
        run: |
          node -e 'const r=require("./candidate-audit.json"); const v=r.metadata?.vulnerabilities; if(!v || r.error || v.critical || v.high || v.moderate || v.low) process.exit(1)'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Capa 1: resolver vulnerabilidades npm con lockfile verificado"
            git push origin HEAD:gruk/capa1-offline-core-v4
          fi
