name: GRUK CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - "gruk/**"

permissions:
  contents: read

concurrency:
  group: gruk-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: GRUK Production Gate
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Validate 77 original Word acceptance criteria against traceability
        run: node scripts/gruk-plan-master-audit.js
      - name: Inspect development dependency advisories
        continue-on-error: true
        run: npm audit --audit-level=high
      - name: Validate Docker Compose configuration
        run: docker compose -f docker-compose.yml config --quiet
      - name: Start MongoDB replica set
        run: |
          docker run -d --name gruk-mongo -p 27017:27017 mongo:7.0 --replSet rs0 --bind_ip_all
          for i in {1..30}; do
            if docker exec gruk-mongo mongosh --quiet --eval 'db.adminCommand("ping").ok' | grep -q 1; then break; fi
            sleep 1
          done
          docker logs gruk-mongo --tail 50 || true
          docker exec gruk-mongo mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"127.0.0.1:27017"}]})'
          for i in {1..30}; do
            if docker exec gruk-mongo mongosh --quiet --eval 'db.hello().isWritablePrimary' | grep -q true; then exit 0; fi
            sleep 1
          done
          echo "MongoDB replica set no alcanzo PRIMARY"
          exit 1
      - name: Production gate
        env:
          NODE_ENV: test
          TEST_MONGO_URI: mongodb://127.0.0.1:27017/?replicaSet=rs0
          GRUK_TEST_MONGO_URI: mongodb://127.0.0.1:27017/gruk_offline_test?replicaSet=rs0
        run: npm run gate

  p004_mongodb_isolation:
    name: P0-04 real MongoDB tenant isolation
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Start disposable local MongoDB
        run: |
          docker run -d --name gruk-p004-disposable -p 127.0.0.1:27017:27017 mongo:7.0
          for i in {1..30}; do
            if docker exec gruk-p004-disposable mongosh --quiet --eval 'db.adminCommand("ping").ok' | grep -q 1; then exit 0; fi
            sleep 1
          done
          docker logs gruk-p004-disposable --tail 50
          exit 1
      - name: Run non-skipped MongoDB tenant isolation integration
        env:
          NODE_ENV: test
          GRUK_TEST_MONGO_DISPOSABLE: "1"
          GRUK_TEST_MONGO_URI: mongodb://127.0.0.1:27017/
        run: |
          node --test test/gruk/p0-04-mongodb-tenant-isolation.integration.test.js | tee /tmp/gruk-p004-test.log
          if grep -Eq '^# skipped [1-9]|^# fail [1-9]' /tmp/gruk-p004-test.log; then
            echo "P0-04 integration test skipped or failed"
            exit 1
          fi
      - name: Run paid-order sale, cash and report with real disposable MongoDB
        env:
          NODE_ENV: test
          GRUK_TEST_MONGO_DISPOSABLE: "1"
          GRUK_TEST_MONGO_URI: mongodb://127.0.0.1:27017/
        run: |
          node --test test/gruk/p0-04-sale-cash-report.integration.test.js > /tmp/gruk-p004-cash.log 2>&1 || { cat /tmp/gruk-p004-cash.log; exit 1; }
          cat /tmp/gruk-p004-cash.log
          if grep -Eq '^# skipped [1-9]|^# fail [1-9]' /tmp/gruk-p004-cash.log; then
            echo "P0-04 sale-to-cash integration skipped or failed"
            exit 1
          fi
