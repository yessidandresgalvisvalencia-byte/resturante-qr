name: GRUK CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - "gruk/**"

permissions:
  contents: read

concurrency:
  group: gruk-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: GRUK Production Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Reject critical production dependencies
        run: npm audit --omit=dev --audit-level=critical
  unit:
    name: GRUK Syntax and Independent Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Check production source syntax
        run: npm run check:syntax
      - name: Run Mongo-independent unit tests
        env:
          NODE_ENV: test
        run: |
          node --test \
            test/gruk/p0-pedido-feature-flag.test.js \
            test/gruk/p0-outbox-worker.test.js \
            test/gruk/p0-sede-sin-sede.test.js \
            test/gruk/p0-sede-idempotencia.test.js \
            test/gruk/p0-http-route-contract.test.js \
            test/gruk/p0-pedido-socket-room.test.js \
            test/gruk/p0-outbox-fencing.test.js \
            test/gruk/p0-pedido-transaccion.test.js
  gate:
    name: GRUK Production Gate
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Start MongoDB replica set
        run: |
          # Rate limits on anonymous registry pulls are transient. Fail closed if all retries fail.
          started=false
          for image in public.ecr.aws/docker/library/mongo:8 mongo:8; do
            for attempt in 1 2 3; do
              if docker run -d --name gruk-mongo -p 127.0.0.1:27017:27017 "$image" --replSet rs0 --bind_ip_all; then
                started=true
                break 2
              fi
              docker rm -f gruk-mongo >/dev/null 2>&1 || true
              sleep $((attempt * 5))
            done
          done
          if [ "$started" != true ]; then
            echo "No se pudo obtener la imagen MongoDB: pruebas ACID obligatorias bloqueadas"
            exit 1
          fi
          for i in {1..30}; do
            if docker exec gruk-mongo mongosh --quiet --eval 'db.adminCommand("ping").ok' | grep -q 1; then break; fi
            sleep 1
          done
          docker exec gruk-mongo mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"127.0.0.1:27017"}]})'
          for i in {1..30}; do
            if docker exec gruk-mongo mongosh --quiet --eval 'db.hello().isWritablePrimary' | grep -q true; then exit 0; fi
            sleep 1
          done
          echo "MongoDB replica set no alcanzo PRIMARY"
          exit 1
      - name: Production gate
        env:
          NODE_ENV: test
          TEST_MONGO_URI: mongodb://127.0.0.1:27017/?replicaSet=rs0
        run: npm run gate
