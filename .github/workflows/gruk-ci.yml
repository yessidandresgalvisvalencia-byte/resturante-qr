name: GRUK CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - feature/finanzas-personales
      - "gruk/**"

permissions:
  contents: read

concurrency:
  group: gruk-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: GRUK Production Gate
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Identificar conflictos reales con main sin fusionar
        shell: bash
        run: |
          git fetch --no-tags origin main
          bash scripts/diagnose-personal-merge.sh 2>&1 | tee "${RUNNER_TEMP}/gruk-personal-merge-diagnostic.log"
      - name: Guardar informe de conflictos de integración
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gruk-personal-merge-diagnostic-${{ github.run_id }}
          path: ${{ runner.temp }}/gruk-personal-merge-diagnostic.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Start MongoDB replica set
        run: |
          docker run -d --name gruk-mongo -p 27017:27017 mongo:8 --replSet rs0 --bind_ip_all
          for i in {1..30}; do
            if docker exec gruk-mongo mongosh --quiet --eval 'db.adminCommand("ping").ok' | grep -q 1; then break; fi
            sleep 1
          done
          docker exec gruk-mongo mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"127.0.0.1:27017"}]})'
          for i in {1..30}; do
            if docker exec gruk-mongo mongosh --quiet --eval 'db.hello().isWritablePrimary' | grep -q true; then exit 0; fi
            sleep 1
          done
          echo "MongoDB replica set no alcanzo PRIMARY"
          exit 1
      - name: Production gate
        env:
          NODE_ENV: test
          TEST_MONGO_URI: mongodb://127.0.0.1:27017/?replicaSet=rs0&directConnection=true
          GRUK_TEST_DB_CONFIRM: SOLO_PRUEBAS_LOCALES
        shell: bash
        run: |
          set -o pipefail
          npm run gate 2>&1 | tee "${RUNNER_TEMP}/gruk-ci-gate.log"
      - name: Conservar evidencia del gate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gruk-ci-gate-${{ github.run_id }}
          path: ${{ runner.temp }}/gruk-ci-gate.log
          if-no-files-found: ignore
          retention-days: 3
