name: GRUK CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - "gruk/**"

permissions:
  contents: read

concurrency:
  group: gruk-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-lock:
    name: Generate V1000 lockfile artifact
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/enterprise-venta-event-postcommit-20261013'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Resolve pinned dependency tree
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit generated dependency lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "build(enterprise): lock reproducible V1000 dependencies"
            git push origin "HEAD:${{ github.head_ref }}"
          fi
      - name: Export reproducible lockfile
        uses: actions/upload-artifact@v4
        with:
          name: gruk-v1000-generated-lockfile
          path: package-lock.json
          retention-days: 1
  gate:
    name: GRUK Production Gate
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Start MongoDB replica set
        run: |
          docker run -d --name gruk-mongo -p 27017:27017 mongo:8 --replSet rs0 --bind_ip_all
          for i in {1..30}; do
            if [ "$(docker inspect -f '{{.State.Running}}' gruk-mongo 2>/dev/null)" != "true" ]; then
              echo "MongoDB finalizó inesperadamente; registros:"
              docker logs gruk-mongo || true
              exit 1
            fi
            if docker exec gruk-mongo mongosh --quiet --eval 'db.adminCommand("ping").ok' 2>/dev/null | grep -q 1; then break; fi
            sleep 1
          done
          docker exec gruk-mongo mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"127.0.0.1:27017"}]})'
          for i in {1..30}; do
            if docker exec gruk-mongo mongosh --quiet --eval 'db.hello().isWritablePrimary' | grep -q true; then exit 0; fi
            sleep 1
          done
          echo "MongoDB replica set no alcanzo PRIMARY"
          exit 1
      - name: Production gate
        env:
          NODE_ENV: test
          TEST_MONGO_URI: mongodb://127.0.0.1:27017/?replicaSet=rs0
        run: npm run gate
