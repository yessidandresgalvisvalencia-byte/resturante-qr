name: GRUK CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - "gruk/**"

permissions:
  contents: read

concurrency:
  group: gruk-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: GRUK Syntax and Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Check production source syntax
        run: npm run check:syntax
      - name: Run unit tests without MongoDB
        env:
          NODE_ENV: test
          CI: "false"
        run: npm test
  gate:
    name: GRUK Production Gate
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Start MongoDB replica set
        run: |
          docker run -d --name gruk-mongo -p 127.0.0.1:27017:27017 public.ecr.aws/docker/library/mongo:8 --replSet rs0 --bind_ip_all
          for i in {1..30}; do
            if docker exec gruk-mongo mongosh --quiet --eval 'db.adminCommand("ping").ok' | grep -q 1; then break; fi
            sleep 1
          done
          docker exec gruk-mongo mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"127.0.0.1:27017"}]})'
          for i in {1..30}; do
            if docker exec gruk-mongo mongosh --quiet --eval 'db.hello().isWritablePrimary' | grep -q true; then exit 0; fi
            sleep 1
          done
          echo "MongoDB replica set no alcanzo PRIMARY"
          exit 1
      - name: Production gate
        env:
          NODE_ENV: test
          TEST_MONGO_URI: mongodb://127.0.0.1:27017/?replicaSet=rs0
        run: npm run gate
