name: GRUK Empresarial Venta Index Read Only Preflight

on:
  workflow_dispatch:
    inputs:
      database_name:
        description: "Nombre empresarial validado: restaurante"
        required: true
        type: string
      database_confirm:
        description: "Repita exactamente el nombre empresarial"
        required: true
        type: string
      approval:
        description: "Escriba CONFIRMO_SOLO_LECTURA (no aplica cambios)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: gruk-enterprise-db-readonly
  cancel-in-progress: false

jobs:
  inspect:
    name: Inspeccionar datos e indices empresariales — SOLO LECTURA
    runs-on: ubuntu-latest
    environment: gruk-enterprise-db-readonly
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate explicit enterprise context without showing credentials
        env:
          DB: ${{ inputs.database_name }}
          DB_CONFIRM: ${{ inputs.database_confirm }}
          APPROVAL: ${{ inputs.approval }}
          URI: ${{ secrets.GRUK_ENTERPRISE_READONLY_MONGO_URI }}
        run: |
          set -euo pipefail
          if [[ "$DB" != "restaurante" || "$DB_CONFIRM" != "$DB" || "$APPROVAL" != "CONFIRMO_SOLO_LECTURA" || -z "$URI" ]]; then
            echo "::error::Enterprise database, confirmation or read-only secret missing or invalid"
            exit 1
          fi
          echo "Read-only enterprise audit input validated; no migrations will be made"
      - name: Install MongoDB shell
        run: |
          set -euo pipefail
          curl -fsSL https://pgp.mongodb.com/server-7.0.asc | sudo gpg --dearmor -o /usr/share/keyrings/mongodb-server-7.0.gpg
          echo "deb [signed-by=/usr/share/keyrings/mongodb-server-7.0.gpg] https://repo.mongodb.org/apt/ubuntu jammy/mongodb-org/7.0 multiverse" | sudo tee /etc/apt/sources.list.d/mongodb-org-7.0.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y mongodb-mongosh
      - name: Scan index compatibility and tenant ownership (read only)
        env:
          GRUK_ENTERPRISE_MONGO_URI: ${{ secrets.GRUK_ENTERPRISE_READONLY_MONGO_URI }}
          GRUK_ENTERPRISE_DB: ${{ inputs.database_name }}
          GRUK_ENTERPRISE_DB_CONFIRM: ${{ inputs.database_confirm }}
        run: |
          set -euo pipefail
          umask 077
          # Never print raw mongosh output: it can contain connection details or data.
          # Preserve the exit status and show only strictly validated numeric/boolean
          # fields even when the audit fails closed.
          trap 'rm -f /tmp/gruk-real-index-preflight.log' EXIT
          audit_status=0
          mongosh "$GRUK_ENTERPRISE_MONGO_URI" --quiet \
            --file scripts/gruk/p0-04-venta-index-preflight.js \
            > /tmp/gruk-real-index-preflight.log 2>&1 || audit_status=$?
          echo "GRUK P0-04 sanitized aggregate diagnostics:"
          grep -E '^[[:space:]]*(saleCount|missingTenant|invalidEnterpriseOwnership|invalidSiteIds|invalidSiteOwnership|invalidOriginIds|invalidOriginNames|duplicateGroups|targetIndexPresent|dataReadyForIndexBuild|readyForIndexBuild|readyForLegacyRemoval|requiresDbaApproval):[[:space:]]*(true|false|[0-9]+),?[[:space:]]*
 /tmp/gruk-real-index-preflight.log || true
          if [[ "$audit_status" -ne 0 ]]; then
            if grep -Eq '^[[:space:]]*readyForIndexBuild:[[:space:]]*false,?[[:space:]]*
 /tmp/gruk-real-index-preflight.log; then
              echo "::error::P0-04 BLOCKED: audit reports data/index incompatibility; do not deploy or mutate MongoDB"
            elif grep -Eq '^[[:space:]]*saleCount:[[:space:]]*0,?[[:space:]]*
 /tmp/gruk-real-index-preflight.log; then
              echo "::error::P0-04 BLOCKED: enterprise sales collection appears empty or incorrect; do not deploy"
            else
              echo "::error::P0-04 BLOCKED: audit failed before a safe verdict; inspect privately with DBA"
            fi
            exit 1
          fi
          if ! grep -Eq '^[[:space:]]*readyForIndexBuild:[[:space:]]*true,?[[:space:]]*
 /tmp/gruk-real-index-preflight.log; then
            echo "::error::P0-04 BLOCKED: successful shell exit without an explicit ready verdict"
            exit 1
          fi
          echo "P0-04 PASS: read-only index preflight completed; DBA authorization still required"
