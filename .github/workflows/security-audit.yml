name: GRUK Security Audit
on:
  push:
    branches: [feature/finanzas-personales]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Production dependency audit
        shell: bash
        run: |
          set +e
          npm audit --omit=dev --json > npm-audit.json
          code=$?
          node -e 'const fs=require("fs");const a=JSON.parse(fs.readFileSync("npm-audit.json","utf8"));console.log(JSON.stringify(a.metadata?.vulnerabilities||{},null,2));'
          exit $code
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-security-audit
          path: npm-audit.json
          retention-days: 7
