name: GRUK guarded production deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gruk-production-deploy
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run check:syntax
      - name: Start MongoDB replica set
        run: |
          docker run -d --name gruk-mongo -p 27017:27017 mongo:8 --replSet rs0 --bind_ip_all
          for i in {1..30}; do
            if docker exec gruk-mongo mongosh --quiet --eval 'db.adminCommand("ping").ok' | grep -q 1; then break; fi
            sleep 1
          done
          docker exec gruk-mongo mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"127.0.0.1:27017"}]})'
          for i in {1..30}; do
            if docker exec gruk-mongo mongosh --quiet --eval 'db.hello().isWritablePrimary' | grep -q true; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Test
        env:
          TEST_MONGO_URI: mongodb://127.0.0.1:27017/?replicaSet=rs0
          NODE_ENV: test
        run: npm test
      - name: Build check
        run: |
          if npm run | grep -qE '^  build$'; then npm run build; else echo 'No build script: CommonJS runtime'; fi
      - name: Docker image build
        run: docker build -t gruk-enterprise:${{ github.sha }} .
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Require configured deployment secrets
        env:
          DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
          PRODUCTION_HEALTH_URL: ${{ secrets.PRODUCTION_HEALTH_URL }}
        run: |
          test -n "$DEPLOY_HOOK_URL" || { echo "Missing DEPLOY_HOOK_URL"; exit 1; }
          test -n "$PRODUCTION_HEALTH_URL" || { echo "Missing PRODUCTION_HEALTH_URL"; exit 1; }
      - name: Trigger production deployment
        env:
          DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
        run: curl --fail --show-error --silent --max-time 30 --retry 2 -X POST "$DEPLOY_HOOK_URL"
      - name: Verify production health
        env:
          PRODUCTION_HEALTH_URL: ${{ secrets.PRODUCTION_HEALTH_URL }}
        run: |
          for i in $(seq 1 36); do
            if curl --fail --silent --show-error --max-time 8 "$PRODUCTION_HEALTH_URL" > /tmp/gruk-health.json; then
              node -e 'const x=require("/tmp/gruk-health.json");if(x.status!=="ok"||x.db!=="connected")process.exit(1)'
              exit 0
            fi
            sleep 10
          done
          echo "Production health not verified"
          exit 1
