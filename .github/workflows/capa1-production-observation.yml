name: GRUK Production Read-Only Observation
on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/capa1-production-observation.yml"
permissions:
  contents: read
jobs:
  observe-production:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Observe the authorized Render service without deploying
        env:
          GRUK_URL: https://resturante-qr.onrender.com
        run: |
          set -u
          echo "Target: resturante-qr (read only)"
          for path in / /health; do
            echo "GET ${path}"
            status=$(curl -L -sS -o /tmp/gruk-observation-body -w '%{http_code}' --connect-timeout 8 --max-time 25 "${GRUK_URL}${path}") || status=000
            echo "HTTP ${status}"
            if [ "${path}" = "/health" ] && [ "${status}" = "200" ]; then
              node -e 'let j;try{j=JSON.parse(require("fs").readFileSync("/tmp/gruk-observation-body","utf8"));}catch{process.exit(1)};if(j.status!=="ok"||j.db!=="connected")process.exit(1);console.log("Health status confirmed:",j.status,"DB:",j.db)'
            fi
            if [ "${status}" != "200" ]; then
              echo "::warning::Render resturante-qr ${path} HTTP ${status}"
              exit 1
            fi
          done
