name: GRUK production health
on:
  workflow_run:
    workflows: ["GRUK CI"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  health:
    name: Verify production health and readiness
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Wait for Render deployment and verify health
        env:
          EXPECTED_COMMIT: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          HEALTH_URL: https://resturante-qr-1.onrender.com/health
          READY_URL: https://resturante-qr-1.onrender.com/ready
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            status=$(curl --silent --show-error --location --max-time 15 --output /tmp/gruk-health.json --write-out '%{http_code}' "$HEALTH_URL") || status="000"
            ready_status=$(curl --silent --show-error --location --max-time 15 --output /tmp/gruk-ready.json --write-out '%{http_code}' "$READY_URL") || ready_status="000"
            if [ "$status" = "200" ] && [ "$ready_status" = "200" ] && node -e '
              const fs = require("node:fs");
              const h = JSON.parse(fs.readFileSync("/tmp/gruk-health.json", "utf8"));
              const r = JSON.parse(fs.readFileSync("/tmp/gruk-ready.json", "utf8"));
              if (r.ready !== true || r.db !== "connected") process.exit(1);
              if (h.status !== "ok" || h.db !== "connected" || !h.version || !Number.isFinite(h.uptime)) process.exit(1);
              if (!/^[0-9a-f]{40}$/.test(process.env.EXPECTED_COMMIT || "") || h.commit !== process.env.EXPECTED_COMMIT) process.exit(1);
            '; then
              echo "GRUK /health and /ready: HTTP 200, MongoDB connected, commit verified: $EXPECTED_COMMIT"
              cat /tmp/gruk-health.json
              exit 0
            fi
            echo "Attempt $attempt/30: health HTTP $status, ready HTTP $ready_status, expected commit $EXPECTED_COMMIT; retry in 20s"
            sleep 20
          done
          echo "::error::GRUK production /health failed verification"
          exit 1
