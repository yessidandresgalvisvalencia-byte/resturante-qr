name: GRUK dependency remediation evidence

on:
  pull_request:
    paths:
      - '.github/workflows/gruk-dependency-remediation.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  lockfile-remediation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - name: Generate reproducible remediation candidate (no commit or deployment)
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm audit --omit=dev --audit-level=high --json > audit-before.json || true
          npm audit fix --package-lock-only --ignore-scripts --no-fund
          npm ci --ignore-scripts
          npm audit --omit=dev --audit-level=high --json > audit-after.json || audit_exit=$?
          export AUDIT_EXIT="${audit_exit:-0}"
          node <<'NODE'
          const fs = require('node:fs');
          const audit = JSON.parse(fs.readFileSync('audit-after.json', 'utf8'));
          const counts = audit.metadata?.vulnerabilities;
          if (!counts || !['high', 'critical'].every(k => Number.isInteger(counts[k]))) {
            throw new Error('npm audit returned no valid vulnerability counts');
          }
          if (counts.high + counts.critical > 0) {
            throw new Error(`Unresolved high/critical vulnerabilities: ${counts.high}/${counts.critical}`);
          }
          if (audit.error || (process.env.AUDIT_EXIT && process.env.AUDIT_EXIT !== '0')) {
            throw new Error('npm audit failed without reportable high/critical vulnerabilities');
          }
          NODE
      - name: Start MongoDB replica set for integration tests
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name gruk-mongo -p 27017:27017 mongo:7.0 --replSet rs0 --bind_ip_all
          for i in {1..30}; do
            if docker exec gruk-mongo mongosh --quiet --eval 'db.adminCommand("ping").ok' | grep -q 1; then break; fi
            sleep 1
          done
          docker exec gruk-mongo mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"127.0.0.1:27017"}]})'
          for i in {1..30}; do
            if docker exec gruk-mongo mongosh --quiet --eval 'db.hello().isWritablePrimary' | grep -q true; then exit 0; fi
            sleep 1
          done
          docker logs gruk-mongo --tail 50
          exit 1
      - name: Validate remediated dependency graph against GRUK quality gate
        env:
          NODE_ENV: test
          TEST_MONGO_URI: mongodb://127.0.0.1:27017/?replicaSet=rs0
          GRUK_TEST_MONGO_URI: mongodb://127.0.0.1:27017/gruk_offline_test?replicaSet=rs0
        run: npm run gate
      - name: Save reviewed lockfile candidate and audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gruk-lockfile-remediation-candidate
          path: |
            package-lock.json
            audit-before.json
            audit-after.json
          retention-days: 7

  propose-reviewed-lockfile:
    # Only a trusted, manually dispatched workflow may write to GitHub.
    # Never grant write permissions to pull_request code.
    if: github.event_name == 'workflow_dispatch'
    needs: lockfile-remediation
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - name: Reproduce audited lockfile candidate
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm audit fix --package-lock-only --ignore-scripts --no-fund
          npm ci --ignore-scripts
          npm audit --omit=dev --audit-level=high
          git diff --exit-code -- package.json
          test -n "$(git diff -- package-lock.json)"
      - name: Open isolated review PR (never merge or deploy)
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          add-paths: package-lock.json
          branch: gruk/generated-security-lockfile
          base: main
          commit-message: 'fix(security): remediate audited npm lockfile'
          title: 'fix(security): apply audited npm lockfile remediation'
          body: |
            Generated by the trusted manual GRUK dependency remediation workflow.
            Candidate only: review lockfile diff, audit evidence and all required CI.
            Do not merge without green quality, integration and offline checks.
            No Render deployment or changes to GRUK Personal/Blushea.
          draft: true
