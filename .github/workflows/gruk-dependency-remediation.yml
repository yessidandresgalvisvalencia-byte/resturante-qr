name: GRUK dependency remediation evidence

on:
  pull_request:
    paths:
      - '.github/workflows/gruk-dependency-remediation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lockfile-remediation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - name: Generate reproducible remediation candidate (no commit or deployment)
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm audit --omit=dev --audit-level=high --json > audit-before.json || true
          npm audit fix --package-lock-only --ignore-scripts --no-fund
          npm ci --ignore-scripts
          npm audit --omit=dev --audit-level=high --json > audit-after.json || audit_exit=$?
          export AUDIT_EXIT="${audit_exit:-0}"
          node <<'NODE'
          const fs = require('node:fs');
          const audit = JSON.parse(fs.readFileSync('audit-after.json', 'utf8'));
          const counts = audit.metadata?.vulnerabilities;
          if (!counts || !['high', 'critical'].every(k => Number.isInteger(counts[k]))) {
            throw new Error('npm audit returned no valid vulnerability counts');
          }
          if (counts.high + counts.critical > 0) {
            throw new Error(`Unresolved high/critical vulnerabilities: ${counts.high}/${counts.critical}`);
          }
          if (audit.error || (process.env.AUDIT_EXIT && process.env.AUDIT_EXIT !== '0')) {
            throw new Error('npm audit failed without reportable high/critical vulnerabilities');
          }
          NODE
      - name: Validate remediated dependency graph against GRUK quality gate
        run: npm run gate
      - name: Save reviewed lockfile candidate and audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gruk-lockfile-remediation-candidate
          path: |
            package-lock.json
            audit-before.json
            audit-after.json
          retention-days: 7
